[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-cover-letter"
version = "0.1.0"
description = "Cover letter generation and analysis service"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src"]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "psycopg2-binary>=2.9.7",
    "sqlalchemy>=2.0.21",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "qdrant-client>=1.6.4",
    "minio>=7.1.17",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "sentence-transformers>=2.2.2",
    "PyPDF2>=3.0.1",
    "kafka-python>=2.0.2",
    "openai>=1.3.0",
    "langchain>=0.0.340",
    "langchain-openai>=0.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.24.1",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[project.scripts]
serve = "uvicorn api_cover_letter_main:app --reload --host 0.0.0.0 --port 8010"
serve-prod = "uvicorn api_cover_letter_main:app --host 0.0.0.0 --port 8010"