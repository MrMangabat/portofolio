[tool:pytest]
# Pytest configuration for SonarCube compatibility - External testing approach

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Python path configuration for external testing
pythonpath = .

# Coverage configuration for SonarCube
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src/models/database/postgresql/file_metadata_models
    --cov=src/config/config_db_connections
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=90

# Test markers for organization
markers =
    unit: Unit tests for individual components
    integration: Integration tests with database
    constraint: Tests for database constraints and validation
    performance: Tests for query performance and indexing
    cascade: Tests for cascade delete operations
    lookup: Tests for lookup table operations

# Minimum Python version
minversion = 6.0

# Suppress warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning